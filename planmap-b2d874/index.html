<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan Mapper</title>
<style>body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:#f4f6fa;color:#1c2433;margin:0}.bar{background:#00205b;color:#fff;padding:16px 50px;font-weight:700;font-size:17px}.m{max-width:560px;margin:60px auto;text-align:center;font-size:15px;line-height:1.5}</style>
</head>
<body>
<div class="bar">Plan Mapper</div>
<div class="m" id="m">Loading…</div>
<script>
// The app itself lives on the Mac mini, so updates there go live without changing this page.
(async function () {
  var API = "https://automateds-mac-mini.tail5dcb67.ts.net";
  try {
    var r = await fetch(API + "/planmapper/app.html", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    var html = await r.text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById("m").textContent = "Plan Mapper is offline right now. The Mac that runs it may be asleep or restarting. Try again in a few minutes.";
  }
})();
</script>
</body>
</html>
