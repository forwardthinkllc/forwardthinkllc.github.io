<style>
:root{
  --bg:#0E1217; --surface:#171D25; --surface2:#1E2833; --line:#252D38; --line2:#3A4450;
  --text:#EEF1F4; --text2:#C9D0D8; --muted:#A3ADB9; --faint:#8B96A3;
  --green:#2FBF71; --green-t:#7FD6A6; --green-bg:#15291F;
  --amber:#F2A93D; --amber-t:#F2C66D; --amber-bg:#33280F;
  --red:#D93D42; --red-t:#F29B9B; --red-bg:#3A1E1E;
  --blue-t:#9CC7EE; --blue-bg:#172230;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
a{color:var(--green-t)} a:hover{color:#A8E6C4}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input,select{font-family:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--green-t);outline-offset:2px}
label{font-size:13px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 48px}
.wrap.wide{max-width:1000px}
.row{display:flex;gap:12px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-family:var(--mono)}
.btn{height:52px;border-radius:14px;border:none;background:var(--green);color:#0E1217;font-size:16px;font-weight:700;padding:0 20px;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text);font-weight:600}
.btn.small{height:40px;width:auto;font-size:14px;padding:0 14px;border-radius:10px;white-space:nowrap}
.btn.danger{background:transparent;border:1px solid #6B2B2E;color:var(--red-t)}
.err{background:var(--red-bg);color:#F5D0D0;border-radius:12px;padding:12px 14px;font-size:14px}
.note{background:var(--blue-bg);color:#D6E6F5;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;height:40px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--surface2);color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv > :first-child{color:var(--muted)} .kv > :last-child{font-weight:600;text-align:right}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#22303A;color:#CFE3EE;white-space:nowrap}
.chip{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.chip.fwd{background:var(--green-bg);color:var(--green-t)} .chip.back{background:var(--red-bg);color:var(--red-t)} .chip.miss{background:var(--amber-bg);color:var(--amber-t)}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden} .bar > i{display:block;height:100%;border-radius:4px}
.list-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.seg{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.seg button{flex:1;height:40px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:14px} th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)} td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll-x{overflow-x:auto}
/* ---- call screen ---- */
.call{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:max(56px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));gap:12px;z-index:10}
.avatar{position:relative;width:112px;height:112px}
.avatar .face{position:absolute;inset:0;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:#CFE3EE}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--green-t);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.wave{height:56px;display:flex;align-items:center;gap:6px}
.wave i{width:4px;height:36px;border-radius:2px;background:#3A4450;transform:scaleY(.2);transition:background .2s}
.wave.on i{background:var(--green-t);animation:w 1s ease-in-out infinite}
.wave.me i{background:var(--blue-t);animation:w .8s ease-in-out infinite}
@keyframes w{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.round{width:68px;height:68px;border-radius:50%;border:none;background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center}
.round[aria-pressed="true"]{background:var(--text);color:#0E1217}
.hang{width:76px;height:76px;border-radius:50%;border:none;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
.dialbtn{width:76px;height:76px;border-radius:50%;border:none;background:var(--green);color:#0E1217;display:flex;align-items:center;justify-content:center}
.captions{width:100%;max-width:440px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4}
.bubble.them{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:#1D3A2B;align-self:flex-end;border-bottom-right-radius:4px}
.bubble.sys{align-self:center;background:none;color:var(--muted);font-size:13px}
.composer{display:flex;gap:8px;width:100%;max-width:440px}
.composer input{flex:1}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--green-t);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---- debrief markdown ---- */
.md h3{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px}
.md p,.md li{font-size:15px;line-height:1.55;margin:0 0 8px}
.md ul{padding-left:18px;margin:0 0 8px}
.md strong{color:var(--text)}
.md em{color:#D8F0E3;font-style:normal;background:var(--green-bg);padding:1px 4px;border-radius:4px}
/* ---- networking: the face */
.face-wrap{position:relative;width:min(72vw,320px,40vh);aspect-ratio:1;border-radius:24px;overflow:hidden;background:var(--surface2);flex-shrink:0}
.face-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 38%,#2A3644,#161C24 70%)}
.face-ph .ini{width:120px;height:120px;border-radius:50%;background:#2E3B49;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#CFE3EE;transition:transform .08s}
.face-ph.talk .ini{transform:scale(1.04)}
.selfview{position:absolute;right:10px;top:10px;width:28%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:2px solid rgba(238,241,244,.55);background:#000;z-index:2}
.selfview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camtoggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px;font-weight:400;color:var(--text);margin:0}
.camtoggle input{width:20px;height:20px;margin:2px 0 0;flex-shrink:0;accent-color:var(--green)}
.face-wrap.q{width:120px;border-radius:50%}.face-wrap.q .mood-chip,.face-wrap.q .selfview{display:none}
.mood-chip{position:absolute;left:12px;bottom:12px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(14,18,23,.72);color:#E5EDF4;text-transform:capitalize}
.guide{width:100%;max-width:360px;display:flex;flex-direction:column;gap:6px}
.guide .meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#D93D42 0%,#F2A93D 38%,#8FA3B5 55%,#2FBF71 100%)}
.guide .meter i{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#EEF1F4;border:3px solid #0E1217;box-shadow:0 0 0 1px #3A4450;transition:left .6s ease}
.guide .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.guide .read{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.guide .tip{font-size:14px;line-height:1.4;color:var(--text2);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.guide .tip.warn{border-color:#6B4A17;background:#33280F;color:#F5E3BC}
.guide .tip.go{border-color:#2E5E45;background:var(--green-bg);color:#D8F0E3}
.guide .tip.hot{border-color:#6B2B2E;background:var(--red-bg);color:#F5D0D0}
/* ---- waiting line: coaching cards */
.prep{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px}
.prep-h{display:flex;justify-content:space-between;align-items:baseline}.prep-h b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-t)}.prep-h span{font-size:12px;color:var(--faint)}
.prep-deck{position:relative;width:100%;touch-action:pan-y}
.pcard{position:absolute;left:0;top:0;width:100%;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:9px;border:1px solid var(--line);text-align:left}
.pcard.on{opacity:1;visibility:visible}
.prep-deck.instant .pcard,.pdots.instant button{transition:none}
.pcard .ptag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.pcard .ptitle{font-size:19px;font-weight:800;line-height:1.25}
.pcard .pbody{font-size:14px;line-height:1.5;color:var(--text2)}
.pcard .psay{font-size:14px;line-height:1.5;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.06);border-left:3px solid currentColor}
.pcard .pspark{display:flex;align-items:flex-end;gap:6px;height:48px}.pcard .pspark i{width:20px;border-radius:5px 5px 2px 2px;background:var(--amber-t);opacity:.85}.pcard .pspark i.t{background:var(--green-t)}
.pcard.k-focus{background:linear-gradient(160deg,#172230,#141A22)}.pcard.k-focus .ptag{background:var(--blue-bg);color:var(--blue-t);border:1px solid #27405A}.pcard.k-focus .psay{color:var(--blue-t)}
.pcard.k-keep{background:linear-gradient(160deg,#15291F,#141A22)}.pcard.k-keep .ptag{background:var(--green-bg);color:var(--green-t);border:1px solid #2E5E45}.pcard.k-keep .psay{color:var(--green-t)}
.pcard.k-number{background:linear-gradient(160deg,#33280F,#141A22)}.pcard.k-number .ptag{background:var(--amber-bg);color:var(--amber-t);border:1px solid #6B4A17}
.pcard.k-line,.pcard.k-tip{background:linear-gradient(160deg,#221C33,#141A22)}.pcard.k-line .ptag,.pcard.k-tip .ptag{background:#221C33;color:#C7B5F2;border:1px solid #4A3D73}.pcard.k-line .psay,.pcard.k-tip .psay{color:#C7B5F2}
.pdots{display:flex;gap:7px;justify-content:center}.pdots button{width:7px;height:7px;padding:0;border:none;border-radius:50%;background:var(--line2);transition:width .2s}.pdots button.on{width:20px;border-radius:4px;background:var(--green-t)}
@media (prefers-reduced-motion:reduce){.pcard{transition:none}}
.badge{display:inline-flex;flex-direction:column;align-items:center;padding:8px 16px;border-radius:10px;background:#F4F1EA;color:#1B232C;min-width:180px}
.badge b{font-size:18px} .badge span{font-size:13px;color:#4A5561}
.hidden{display:none !important}
@media (min-width:720px){.wrap{padding-top:40px}}
@media (prefers-reduced-motion:reduce){.ring,.wave.on i,.wave.me i,.spin{animation:none}}
</style>

<body>
<div id="app" class="wrap" aria-live="polite"></div>
<div id="call" class="call hidden" role="dialog" aria-modal="true" aria-label="Practice call"></div>
<audio id="botaudio" autoplay playsinline></audio>

<script>
"use strict";
// ======================================================================= basics
const API = (window.DIAL_API || "").replace(/\/$/, "");
const $app = document.getElementById("app");
const $call = document.getElementById("call");
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} },
};
let TOKEN = store.get("dial_token");
let ME = null;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function h(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }
function fmtTime(s){ s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return ""; const d = new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function scoreColor(v){ return v == null ? "var(--line2)" : v >= 3.6 ? "var(--green)" : v >= 2.8 ? "#8FA3B5" : "var(--amber)"; }
const OUTCOMES = {meeting_booked:"Meeting booked", callback_agreed:"Callback agreed", referred_to_right_contact:"Referred to the right contact",
  email_route_obtained:"Email route", respectful_disqualification:"Clean disqualification", transferred_to_voicemail:"Sent to voicemail",
  voicemail_left:"Voicemail left", blocked:"Blocked", hung_up:"Hung up",
  next_step_set:"Next step set", intro_arranged:"Introduction arranged", contact_exchanged:"Swapped contact info",
  graceful_exit:"Clean exit", they_moved_on:"They moved on", rep_ended_abruptly:"Ended abruptly"};
const MOODS = ["neutral","warm","interested","amused","skeptical","thinking","distracted","closed","annoyed"];
const isNet = x => (x && (x.practice || x)) === "networking";
// Cold calls: what the prospect's tone means, and a nudge that never gives away what's behind it.
const PHONE_TIPS = {
  warm:       [7,   "Warming up",          "They're comfortable. Keep it short and keep asking about them."],
  amused:     [6.5, "Enjoying the call",   "Good rapport. Don't let it drift; get to your reason."],
  interested: [6,   "Interested",          "They're leaning in. One follow-up, then ask for a specific time."],
  thinking:   [4.5, "Thinking it over",    "Give them a second. Silence is fine."],
  neutral:    [4,   "Listening",           "Give them a clear reason for the call in one sentence."],
  skeptical:  [3,   "Not convinced",       "Answer plainly in one sentence, then ask a question."],
  distracted: [2,   "Losing interest",     "Shorten up. One sentence, one question."],
  closed:     [1,   "Wants off the call",  "Respect it. Get a route, a name or a callback time, and thank them."],
  annoyed:    [0,   "Something landed wrong", "Own it in one sentence and back off. Don't argue."],
};
const ASK30_RE = /\b(30|thirty)[\s-]*(seconds?|secs?)\b/i;

// What each expression means for the rep, where it sits from cold (0) to warm (7), and what to do about it.
const MOOD_GUIDE = {
  warm:       [7,   "Warming up to you",          "Good. Keep the focus on them."],
  amused:     [6.5, "Enjoying the conversation",  "Nice rapport. No need to rush to business."],
  interested: [6,   "Interested",                 "They're leaning in. Ask one more question about that."],
  thinking:   [4.5, "Thinking it over",           "Give them a second before you add anything."],
  neutral:    [4,   "Listening",                  "Ask something about them."],
  skeptical:  [3,   "Not convinced",              "Get specific, or turn it back to them with a question."],
  distracted: [2,   "Losing interest",            "Keep it short and hand it back with a question about them."],
  closed:     [1,   "Ready to move on",           "Wrap up warmly. Offer a specific next step only if there's a real reason."],
  annoyed:    [0,   "You hit a nerve",            "One chance: own it, back off, and change course."],
};
const STATUS = {graded:"Scored", grading:"Scoring…", failed:"Scoring failed", abandoned:"Didn't connect", active:"Live", queued:"Waiting"};

async function api(path, opts = {}){
  const res = await fetch(API + path, {
    method: opts.method || (opts.body ? "POST" : "GET"),
    headers: Object.assign({"Content-Type":"application/json"}, TOKEN ? {"Authorization":"Bearer "+TOKEN} : {}),
    body: opts.body ? JSON.stringify(opts.body) : (opts.method === "POST" ? "{}" : undefined),
  }).catch(() => { throw new Error("Can't reach the practice line. It may be offline. Try again in a minute."); });
  let data = null; try { data = await res.json(); } catch(e) {}
  if (res.status === 401 && TOKEN && !opts.noAuthRedirect){ TOKEN = null; store.set("dial_token", null); renderLogin("Please sign in again."); throw new Error("signed out"); }
  if (!res.ok) throw new Error((data && (data.error || data.detail)) || "Something went wrong.");
  return data;
}

const ICON = {
  phone:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  mic:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',
  cc:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3"/></svg>',
  send:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
  chat:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>',
  walk:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  warn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2C66D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
};

// ======================================================================= auth screens
function renderLogin(msg){
  $app.className = "wrap";
  $app.replaceChildren(h(`
    <div class="stack" style="margin-top:8vh">

function parseRoute(){
  const p = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (p[0] === "p" && p[1]) return {page:"p", practice:p[1], tab:["practice","progress","history"].includes(p[2]) ? p[2] : "practice"};
  if (p[0] === "admin") return {page:"admin", section:p[1] || "", tab:p[2] === "history" ? "history" : "progress"};
  return {page:"home"};
}
function go(hash){ if (location.hash === hash) renderHome(); else location.hash = hash; }

// ---- the rep's camera: face tracking runs in this browser; only a numeric summary goes to the server
function camWanted(){ return store.get("dial_cam") !== "0"; }
const CAM = {};
const FP = {nose: 1, eyeL: 33, eyeR: 263, eyeLin: 133, eyeRin: 362, mouthL: 61, mouthR: 291, lipTop: 13, lipBot: 14, irisL: 468, irisR: 473};
function loadFaceMesh(){
  if (window.FaceMesh) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = `${API}/vendor/face_mesh/face_mesh.js`;
    sc.onload = res; sc.onerror = () => rej(new Error("face tracking file blocked")); document.head.appendChild(sc); });
}
async function camStart(){
  Object.assign(CAM, {on: false, frames: 0, face: 0, look: 0, lookThem: 0, framesThem: 0, lookYou: 0, framesYou: 0, smile: 0, steady: 0,
    nods: 0, nodsThem: 0, base: null, baseN: 0, pitch: [], nose: [], lastNod: 0, lastFaceAt: performance.now(), recentLook: [], buckets: [],
    smiledEarly: false, t0: performance.now(), busy: false, timer: null, postTimer: null, error: null});
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 480}, height: {ideal: 360}, facingMode: "user"}, audio: false});
  } catch(e){ CAM.error = "camera blocked"; return false; }
  CAM.video = document.createElement("video"); CAM.video.muted = true; CAM.video.playsInline = true; CAM.video.srcObject = CAM.stream;
  try { await CAM.video.play(); await loadFaceMesh();
    CAM.fm = new FaceMesh({locateFile: f => `${API}/vendor/face_mesh/${f}`});
    CAM.fm.setOptions({maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5});
    CAM.fm.onResults(camFrame);
    await CAM.fm.initialize();
  } catch(e){ CAM.error = e.message || "tracking failed"; camStop(); return false; }
  CAM.on = true;
  const loop = async () => {               // about 8 readings a second is plenty and keeps phones cool
    if (!CAM.on) return;
    if (!CAM.busy){ CAM.busy = true; try { await CAM.fm.send({image: CAM.video}); } catch(e){} CAM.busy = false; }
    CAM.timer = setTimeout(loop, 120);
  };
  loop();
  CAM.postTimer = setInterval(() => camPost(false), 5000);
  return true;
}
function camStop(){
  CAM.on = false; clearTimeout(CAM.timer); clearInterval(CAM.postTimer);
  try { CAM.stream && CAM.stream.getTracks().forEach(t => t.stop()); } catch(e){}
  try { CAM.fm && CAM.fm.close && CAM.fm.close(); } catch(e){}
}
function camFrame(res){
  const now = performance.now(), lm = res.multiFaceLandmarks && res.multiFaceLandmarks[0];
  const who = CALL.repSince ? "you" : CALL.botSpeaking ? "them" : "";
  CAM.frames++;
  const sec = Math.floor((now - CAM.t0) / 10000);   // 10-second buckets for the timeline
  const bk = CAM.buckets[sec] || (CAM.buckets[sec] = {t: sec * 10, n: 0, face: 0, look: 0, smile: 0, them: 0, you: 0});
  bk.n++; if (who === "them") bk.them++; if (who === "you") bk.you++;
  if (!lm){ CAM.recentLook.push({t: now, v: 0}); return; }
  CAM.face++; bk.face++; CAM.lastFaceAt = now;
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const eye = d(FP.eyeL, FP.eyeR);
  const mid = {x: (lm[FP.eyeL].x + lm[FP.eyeR].x) / 2, y: (lm[FP.eyeL].y + lm[FP.eyeR].y) / 2};
  const yaw = (lm[FP.nose].x - mid.x) / eye, pitch = (lm[FP.nose].y - mid.y) / eye;
  const ip = (i, o, n) => (lm[i].x - lm[o].x) / (lm[n].x - lm[o].x);
  const gaze = lm.length > 473 ? (ip(FP.irisL, FP.eyeL, FP.eyeLin) + ip(FP.irisR, FP.eyeR, FP.eyeRin)) / 2 : 0.5;
  const mouthW = d(FP.mouthL, FP.mouthR) / eye;
  const corners = (((lm[FP.lipTop].y + lm[FP.lipBot].y) / 2) - (lm[FP.mouthL].y + lm[FP.mouthR].y) / 2) / eye;
  if (CAM.baseN < 25){   // the first couple of seconds set this rep's neutral face
    const b = CAM.base || (CAM.base = {pitch: 0, mouthW: 0, corners: 0});
    b.pitch += pitch / 25; b.mouthW += mouthW / 25; b.corners += corners / 25; CAM.baseN++;
  }
  const b = CAM.baseN >= 25 ? CAM.base : {pitch, mouthW, corners};
  const looking = Math.abs(yaw) < 0.13 && Math.abs(pitch - b.pitch) < 0.13 && gaze > 0.35 && gaze < 0.65;
  const smiling = (Math.max(0, (mouthW - b.mouthW) / (b.mouthW * 0.18)) * 0.6 + Math.max(0, (corners - b.corners) / 0.04) * 0.4) > 0.55;
  if (looking){ CAM.look++; bk.look++; }
  if (smiling){ CAM.smile++; bk.smile++; if (now - CAM.t0 < 15000) CAM.smiledEarly = true; }
  if (who === "them"){ CAM.framesThem++; if (looking) CAM.lookThem++; }
  if (who === "you"){ CAM.framesYou++; if (looking) CAM.lookYou++; }
  CAM.recentLook.push({t: now, v: looking ? 1 : 0}); while (CAM.recentLook.length && now - CAM.recentLook[0].t > 3000) CAM.recentLook.shift();
  CAM.nose.push({t: now, x: lm[FP.nose].x / eye, y: lm[FP.nose].y / eye}); while (CAM.nose.length && now - CAM.nose[0].t > 1000) CAM.nose.shift();
  let path = 0; for (let i = 1; i < CAM.nose.length; i++) path += Math.hypot(CAM.nose[i].x - CAM.nose[i-1].x, CAM.nose[i].y - CAM.nose[i-1].y);
  if (path / 1.5 < 0.2) CAM.steady++;
  CAM.pitch.push({t: now, p: pitch - b.pitch}); while (CAM.pitch.length && now - CAM.pitch[0].t > 1200) CAM.pitch.shift();
  const ps = CAM.pitch.map(x => x.p), mx = Math.max(...ps), mn = Math.min(...ps);
  if (CAM.baseN >= 25 && mx - mn > 0.09 && ps[ps.length - 1] - mn < 0.03 && ps.indexOf(mx) < ps.length - 1 && now - CAM.lastNod > 900){
    CAM.nods++; CAM.lastNod = now; if (who === "them") CAM.nodsThem++;
  }
}
function camSummary(){
  const pct = (a, b) => b ? Math.round(100 * a / b) : null;
  const secs = Math.round((performance.now() - CAM.t0) / 1000);
  return {
    seconds: secs, face_in_frame_pct: pct(CAM.face, CAM.frames),
    eye_contact_pct: pct(CAM.look, CAM.face), eye_contact_while_they_talk_pct: pct(CAM.lookThem, CAM.framesThem),
    eye_contact_while_you_talk_pct: pct(CAM.lookYou, CAM.framesYou), smile_pct: pct(CAM.smile, CAM.face),
    smiled_in_first_15s: CAM.smiledEarly, nods: CAM.nods, nods_while_they_talk: CAM.nodsThem, steady_pct: pct(CAM.steady, CAM.face),
    timeline: CAM.buckets.filter(Boolean).slice(0, 60).map(k => ({t: k.t, eye_contact_pct: pct(k.look, k.face), smile_pct: pct(k.smile, k.face),
      face_pct: pct(k.face, k.n), talking: k.them > k.you ? "them" : k.you > k.them ? "you" : ""})),
  };
}
function camPost(final){
  if (!CAM.frames || !CALL.id) return Promise.resolve();
  return api(`/api/calls/${CALL.id}/presence`, {body: {summary: camSummary(), final}}).catch(() => {});
}
function camCue(){
  if (!CAM.on) return null;
  const now = performance.now();
  if (now - CAM.lastFaceAt > 3000) return "We can't see you. Face the camera.";
  const r = CAM.recentLook; const share = r.length ? r.reduce((a, x) => a + x.v, 0) / r.length : 1;
  if (CALL.botSpeaking && r.length > 10 && share < 0.3) return "Look up. They're talking to you.";
  return null;
}

// ---- the face: realistic expression photos when they exist, a placeholder until then
function faceSrc(face, mood, talk){ return `${API}/avatars/${face}/${mood}${talk ? "_talk" : ""}.jpg`; }
function preloadFace(face){
  CALL.faceImgs = {};
  MOODS.forEach(m => [false, true].forEach(t => {
    const img = new Image();
    img.onload = () => { CALL.faceImgs[m + (t ? "_talk" : "")] = img.src; drawFace(); };
    img.src = faceSrc(face, m, t);
  }));
}
function drawFace(){
  const el = document.getElementById("face"); if (!el) return;
  const m = CALL.mood || "neutral", F = CALL.faceImgs || {};
  const src = (CALL.talking && (F[m + "_talk"] || (F[m] ? null : F["neutral_talk"]))) || F[m] || F["neutral"];
  if (src){
    let img = el.querySelector("img");
    if (!img){ el.replaceChildren(); img = document.createElement("img"); img.alt = ""; el.appendChild(img); }
    if (img.getAttribute("src") !== src) img.setAttribute("src", src);
    return;
  }
  let ph = el.querySelector(".face-ph");
  if (!ph){ el.replaceChildren(h(`<div class="face-ph"><div class="ini">${esc(initials(CALL.caller.name))}</div></div><div class="mood-chip"></div>`)); ph = el.querySelector(".face-ph"); }
  ph.classList.toggle("talk", !!CALL.talking);
  el.querySelector(".mood-chip").textContent = m;
}
// Mouth: follow the loudness of their voice, with a short hold so it doesn't flutter.
function watchMouth(analyser){
  const buf = new Uint8Array(analyser.fftSize);
  let lastOn = 0;
  const loop = () => {
    if (CALL.ended || !CALL.voiceChain) return;
    analyser.getByteTimeDomainData(buf);
    let sum = 0; for (let i = 0; i < buf.length; i++){ const v = (buf[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / buf.length), now = performance.now();
    if (rms > 0.035) lastOn = now;
    const talking = now - lastOn < 110;
    if (talking !== CALL.talking){ CALL.talking = talking; drawFace(); }
    CALL.mouthRaf = requestAnimationFrame(loop);
  };
  CALL.mouthRaf = requestAnimationFrame(loop);
}
// Quiet room tone so it doesn't sound like a studio.
function startRoom(ctx){
  try {
    const len = ctx.sampleRate * 3, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = ctx.createBufferSource(); src.buffer = b; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
    const g = ctx.createGain(); g.gain.value = 0.05;
    src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start();
    CALL.room = [src, lp, g];
  } catch(e){}
}

// ----------------------------------------------------------------------- progress
function sparkline(series, emptyText, label){
  if (series.length < 2) return `<p class="muted" style="font-size:14px;margin:0">${esc(emptyText || "Your trend line appears after two scored calls.")}</p>`;
  const W = 440, H = 120, P = 10, n = series.length;
  const x = i => P + i * (W - 2*P) / (n - 1), y = v => H - P - (v - 1) / 4 * (H - 2*P);
  const pts = series.map((s,i) => `${x(i).toFixed(1)},${y(s.overall).toFixed(1)}`).join(" ");
  const target = y(3.6).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label || "Overall score for each scored call, oldest to newest")}">
    <line x1="${P}" x2="${W-P}" y1="${target}" y2="${target}" stroke="#2B5C41" stroke-dasharray="4 4"/>
    <text x="${W-P}" y="${+target-6}" text-anchor="end" fill="#7FD6A6" font-size="11" font-family="IBM Plex Mono">call-ready 3.6</text>
    <polyline points="${pts}" fill="none" stroke="#9CC7EE" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${series.map((s,i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(s.overall).toFixed(1)}" r="3.5" fill="#9CC7EE"><title>${esc(s.n ? new Date(s.date).toLocaleDateString(undefined,{month:"short",day:"numeric"}) + ` · ${s.n} call${s.n>1?"s":""}` : fmtDate(s.date))}: ${s.overall}</title></circle>`).join("")}
  </svg>`;
}
function phaseBars(obj){
  const e = Object.entries(obj || {});
  if (!e.length) return `<p class="muted" style="font-size:14px;margin:0">Scores by phase appear after the first scored call.</p>`;
  return e.map(([k,v]) => `<div class="row" style="gap:12px"><div style="width:96px;font-size:13px;color:var(--text2)">${esc(k)}</div>
    <div class="bar"><i style="width:${(v||0)*20}%;background:${scoreColor(v)}"></i></div>
    <div class="mono" style="width:30px;text-align:right;font-size:13px">${v==null?"–":(+v).toFixed(1)}</div></div>`).join("");
}

// ======================================================================= the call
// Voice runs on the practice server: your mic streams to it over WebRTC, the prospect's voice streams back.
// Events (who's speaking, transfers, captions) arrive on a data channel using the RTVI message format.
const CALL = {};

function callFrame(inner){ $call.classList.remove("hidden"); $call.replaceChildren(h(inner)); }
function closeCall(){ $call.classList.add("hidden"); $call.replaceChildren(); }
function initials(name){ return (name || "").split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0,2).map(w => w[0]).join("").toUpperCase(); }

// ---- phone sounds (generated in the browser, no files) ----
let TONES = null;
function tones(){
  if (TONES) return TONES;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const out = ctx.createGain(); out.gain.value = 0.18; out.connect(ctx.destination);
  function burst(freqs, start, dur){
    freqs.forEach(f => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(out);
      g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(1, start + 0.02);
      g.gain.setValueAtTime(1, start + dur - 0.03); g.gain.linearRampToValueAtTime(0, start + dur);
      o.start(start); o.stop(start + dur + 0.05);
    });
  }
  let ringTimer = null;
  TONES = {
    ctx,
    ring(){                       // US ringback: 440 + 480 Hz, 2 s on, 4 s off
      this.stopRing();
      const once = () => burst([440, 480], ctx.currentTime + 0.05, 2.0);
      once(); ringTimer = setInterval(once, 6000);
    },
    stopRing(){ clearInterval(ringTimer); ringTimer = null; },
    hangup(){                     // call-ended beeps
      this.stopRing();
      const t = ctx.currentTime + 0.05;
      [0, 0.28, 0.56].forEach(d => burst([480, 620], t + d, 0.18));
    },
  };
  return TONES;
}

async function startCall(card){
  try { tones().ctx.resume(); } catch(e){}   // unlock audio while the tap still counts as a gesture
  Object.assign(CALL, {id:card.id, card, lines:[], ended:false, t0:null, muted:false, captions:false, pingTimer:null, clockTimer:null, pc:null, dc:null, mic:null, keepalive:null, connecting:false, hungUp:false,
    net: isNet(card), mood: "neutral", talking: false, faceImgs: {}, room: null, mouthRaf: null,
    temp: 4, lastScore: 4, trend: 0, repSince: null, botSpeaking: false,
    phase: isNet(card) ? "net" : (card.rep_card.dialing === "main office line" ? "gk" : "dm"), phaseStart: null, questions: 0, ask30: null});
  CALL.caller = CALL.net ? {name: card.rep_card.target, sub: card.rep_card.company}
                         : {name: card.rep_card.company, sub: card.rep_card.dialing === "direct line" ? "Direct line" : "Main office"};
  if (CALL.net) preloadFace(card.rep_card.face || "w1");
  CALL.camAsked = CALL.net && camWanted();
  CALL.prep = null; CALL.prepIdx = 0; CALL.prepNext = null; clearTimeout(CALL.prepTimer);
  api(`/api/prep?practice=${encodeURIComponent(card.practice || "cold_call")}`).then(p => {
    CALL.prep = p; if (CALL.state === "queued" && !CALL.ended) renderLive("queued", CALL.queuePos);
  }).catch(() => {});
  // Ask for the microphone (and camera, for networking) now, while the rep's tap still counts as a user gesture.
  try { const s = await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t => t.stop()); }
  catch(e){ return failCall("Your microphone is blocked. Allow microphone access for this page, then try again."); }
  if (CALL.camAsked){
    try { const v = await navigator.mediaDevices.getUserMedia({video:true}); v.getTracks().forEach(t => t.stop()); }
    catch(e){ CALL.camAsked = false; CALL.camNote = "Camera blocked, so this one is voice only."; }
  }
  renderLive("dialing");
  let r;
  try { r = await api(`/api/calls/${card.id}/dial`, {body:{mode:"voice"}}); }
  catch(err){ return failCall(err.message); }
  CALL.pingTimer = setInterval(ping, 10000);
  handleState(r);
}

async function ping(){ try { handleState(await api(`/api/calls/${CALL.id}/ping`, {method:"POST"})); } catch(e){} }

function handleState(r){
  if (!r || CALL.ended) return;
  if (r.status === "queued"){ renderLive("queued", r.position); return; }
  if (r.status === "active" && r.voice && !CALL.connecting){
    CALL.connecting = true;
    renderLive("ringing");
    if (!CALL.net) try { tones().ring(); } catch(e){}
    connectVoice(r.ice_servers || []);
    return;
  }
  if (r.status !== "active" && r.status !== "queued") endCall(false);
}

async function connectVoice(iceServers){
  const audio = document.getElementById("botaudio");
  // Let it ring a few times first (or, face to face, a moment to walk over).
  if (CALL.camAsked) camStart().then(ok => { if (ok) attachSelfView(); else CALL.camNote = "Camera tracking didn't start, so this one is voice only."; });
  await sleep(CALL.net ? 700 : (1 + Math.floor(Math.random() * 3)) * 2000);
  if (CALL.ended) return;
  let mic;
  try {
    mic = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  } catch(e){ return failCall("Your microphone is blocked. Allow microphone access for this page, then try again."); }
  const pc = new RTCPeerConnection({iceServers});
  CALL.pc = pc; CALL.mic = mic;
  pc.addTransceiver(mic.getAudioTracks()[0], {direction: "sendrecv"});
  pc.ontrack = ev => {
    if (ev.track.kind !== "audio") return;
    const stream = ev.streams[0] || new MediaStream([ev.track]);
    audio.srcObject = stream;
    // Shape the prospect's voice like a real phone line (narrow band + light compression).
    // Chrome only feeds a remote stream to Web Audio while an element is playing it, so the element stays attached but muted.
    if (CALL.net) try {
      // Face to face: full-range voice, a little room tone, and a level meter that drives the mouth.
      const ctx = tones().ctx;
      const src = ctx.createMediaStreamSource(stream);
      const g = ctx.createGain(); g.gain.value = 1.15;
      const an = ctx.createAnalyser(); an.fftSize = 512;
      src.connect(an); an.connect(g); g.connect(ctx.destination);
      CALL.voiceChain = [src, g, an];
      audio.muted = true;
      if (!CALL.room) startRoom(ctx);
      watchMouth(an);
    } catch(e){ audio.muted = false; }
    else try {
      const ctx = tones().ctx;
      const src = ctx.createMediaStreamSource(stream);
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 300;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3400;
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -22; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.08;
      const g = ctx.createGain(); g.gain.value = 1.4;
      src.connect(hp); hp.connect(lp); lp.connect(comp); comp.connect(g); g.connect(ctx.destination);
      CALL.voiceChain = [src, hp, lp, comp, g];
      audio.muted = true;
    } catch(e){ audio.muted = false; }
    audio.play().catch(() => {});
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "disconnected" && !CALL.ended && CALL.t0){
      setTimeout(() => { if (!CALL.ended && pc.connectionState !== "connected") prospectHungUp(); }, 2500);
    }
    if (["failed", "closed"].includes(pc.connectionState) && !CALL.ended){
      if (!CALL.t0) failCall("The call couldn't connect. If you're on a work network, try your phone on cellular.");
      else endCall(false);
    }
  };
  const dc = pc.createDataChannel("rtvi", {ordered: true});
  CALL.dc = dc;
  dc.onclose = () => { if (!CALL.ended && CALL.t0) prospectHungUp(); };
  dc.onopen = () => {
    dc.send(JSON.stringify({label: "rtvi-ai", type: "client-ready", id: String(Date.now()), data: {version: "2.1.0", about: {library: "dial-practice"}}}));
    CALL.keepalive = setInterval(() => { try { dc.send("ping: " + Date.now()); } catch(e){} }, 1000);
  };
  dc.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (!m || m.label !== "rtvi-ai") return;
    const d = m.data || {};
    switch (m.type){
      case "bot-started-speaking": if (!CALL.t0) pickedUp(); CALL.botSpeaking = true; wave("on"); break;
      case "bot-stopped-speaking": CALL.botSpeaking = false; wave(""); break;
      case "user-started-speaking": wave("me"); if (!CALL.repSince) CALL.repSince = Date.now();
        if (CALL.ask30 && CALL.ask30.waiting){ CALL.ask30.waiting = false; CALL.ask30.start = Date.now(); } break;
      case "user-stopped-speaking": wave(""); CALL.repSince = null; updateGuide(); break;
      case "user-transcription": if (d.final && d.text){ addLine({speaker: "rep", text: d.text}); repSaid(d.text); } break;
      case "bot-output": if (d.text && d.aggregated_by === "sentence"){ addLine({speaker: "them", text: d.text}); themSaid(d.text); } break;
      case "server-message": serverMessage(d); break;
    }
  };
  try {
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(res => {                       // gather relay candidates (max 4 s)
      if (pc.iceGatheringState === "complete") return res();
      const t = setTimeout(res, 4000);
      pc.addEventListener("icegatheringstatechange", () => { if (pc.iceGatheringState === "complete"){ clearTimeout(t); res(); } });
    });
    const answer = await api(`/api/calls/${CALL.id}/webrtc/offer`, {body: {sdp: pc.localDescription.sdp, type: pc.localDescription.type}});
    await pc.setRemoteDescription({sdp: answer.sdp, type: answer.type});
  } catch(err){
    if (!CALL.ended) failCall("The call couldn't connect: " + err.message);
  }
}

function hangUpMedia(){
  clearInterval(CALL.keepalive);
  try { CALL.dc && CALL.dc.readyState === "open" && CALL.dc.send(JSON.stringify({label: "rtvi-ai", type: "disconnect-bot", id: String(Date.now())})); } catch(e){}
  try { CALL.pc && CALL.pc.close(); } catch(e){}
  try { CALL.mic && CALL.mic.getTracks().forEach(t => t.stop()); } catch(e){}
  const audio = document.getElementById("botaudio"); if (audio){ audio.srcObject = null; audio.muted = false; }
  try { (CALL.voiceChain || []).forEach(n => n.disconnect()); } catch(e){}
  CALL.voiceChain = null;
  try { cancelAnimationFrame(CALL.mouthRaf); (CALL.room || []).forEach((n, i) => { if (i === 0) n.stop(); n.disconnect(); }); } catch(e){}
  CALL.room = null;
}

function pickedUp(){
  try { tones().stopRing(); } catch(e){}
  CALL.t0 = Date.now();
  if (!CALL.phaseStart) CALL.phaseStart = Date.now();
  CALL.clockTimer = setInterval(tick, 500);
  if (CALL.state !== "voicemail") renderLive("connected");
}

function serverMessage(m){
  const d = (m && (m.data || m)) || {};
  if (d.type === "hangup"){ prospectHungUp(); return; }
  if (d.type === "mood"){ if (MOODS.includes(d.mood)){ setMood(d.mood); if (CALL.net) drawFace(); } return; }
  if (d.type === "transfer") renderLive("transfer");
  else if (d.type === "caller"){ CALL.caller = {name: d.name, sub: `${d.title}, ${d.company}`};
    Object.assign(CALL, {phase: "dm", phaseStart: Date.now(), questions: 0, ask30: null, askedWhy: null, menuDone: false, menuAt: null, mood: "neutral", temp: 4, lastScore: 4, trend: 0}); renderLive("connected"); }
  else if (d.type === "voicemail"){ CALL.phase = "vm"; renderLive("voicemail"); }
}

function tick(){ const el = document.getElementById("clock"); if (el && CALL.t0) el.textContent = fmtTime((Date.now() - CALL.t0)/1000); updateGuide(); }

// ---- cold calls: what was said (for the guide only; scoring happens on the server)
const ASKED_WHY_RE = /what('?s| is) (this|it) (about|regarding|in reference to)|what can i (do|help)|how can i help|what do you (want|need)|what are you (calling|selling)|why are you calling|what('?s| is) this for/i;
function themSaid(text){
  if (CALL.net || CALL.phase !== "dm" || CALL.menuDone) return;
  if (ASKED_WHY_RE.test(text)) CALL.askedWhy = Date.now();
}
function repSaid(text){
  if (CALL.net || CALL.phase !== "dm") return;
  if (CALL.askedWhy){   // their answer to "what's this about?": did it offer a few problems to pick from?
    const menu = /one of (three|3|a few)|three (things|problems|areas)|(a )?few things|usually it'?s/i.test(text) || ((text.match(/,/g) || []).length >= 2 && /\bor\b/i.test(text));
    CALL.askedWhy = null;
    if (menu){ CALL.menuDone = true; CALL.menuAt = Date.now(); }
  }
  CALL.questions += (text.match(/\?/g) || []).length;
  if (!CALL.ask30 && ASK30_RE.test(text)){
    const permission = /\?\s*$/.test(text.trim());
    CALL.ask30 = {waiting: permission, start: permission ? null : Date.now() - 2000};
  } else if (CALL.ask30 && !CALL.ask30.done && CALL.ask30.start && /\?\s*$/.test(text.trim())){
    CALL.ask30.done = true;   // handed it back with a question
  }
}
function callCue(){
  const now = Date.now(), inPhase = CALL.phaseStart ? (now - CALL.phaseStart) / 1000 : 0;
  const held = CALL.repSince ? (now - CALL.repSince) / 1000 : 0;
  if (CALL.phase === "gk"){
    if (held >= 12) return ["Keep it to one breath with the front desk. Wrap the thought.", "warn"];
    if (inPhase >= 90) return [`${fmtTime(inPhase)} with the front desk. Ask for the best route: an email and a good time.`, "hot"];
    if (inPhase >= 45) return [`${fmtTime(inPhase)} with the front desk. Aim to be through or routed by one minute.`, "warn"];
    return ["Name, company and a one-line reason. Then ask for the person.", ""];
  }
  if (CALL.phase === "dm"){
    const a = CALL.ask30;
    if (a && a.start && !a.done){
      const used = (now - a.start) / 1000;
      if (used >= 30) return ["You asked for 30 seconds and you're past it. Land it with a question now.", "hot"];
      return [`Your 30 seconds: ${Math.ceil(30 - used)} left. End with a question.`, "warn"];
    }
    if (held >= 30) return [`You've had the floor ${Math.floor(held)} seconds. Finish the thought and ask them something.`, "warn"];
    if (CALL.askedWhy && !CALL.repSince) return ["They asked what it's about. A strong move: three problems owners in their industry deal with, then ask which one fits.", "go"];
    if (CALL.menuAt && now - CALL.menuAt < 15000) return ["Good. Let them pick, then one follow-up on what they say.", "go"];
    if (CALL.questions >= 3) return ["That's plenty of discovery for a cold call. Play back what you heard in one sentence and ask for a specific time.", "warn"];
    if (inPhase >= 300) return ["You're in the window where meetings get booked. If you've heard a reason, ask for a specific day and time.", ""];
  }
  return null;
}

// ---- networking: the guide under the face (which way the conversation is going, and what to do)
function updateCallGuide(g){
  if (CALL.phase === "vm"){ if (g.dataset.html !== "vm"){ g.dataset.html = "vm"; g.innerHTML = `<div class="tip">Voicemail: your name, a one-line reason, your number twice. Under 25 seconds.</div>`; } return; }
  const [, read, tip] = PHONE_TIPS[CALL.mood] || PHONE_TIPS.neutral;
  const cue = callCue();
  let tipText = tip, cls = CALL.mood === "annoyed" ? "hot" : (CALL.mood === "distracted" || CALL.mood === "closed") ? "warn" : "";
  if (cue && (cue[1] || CALL.mood === "neutral" || CALL.phase === "gk")){ tipText = cue[0]; cls = cue[1] || cls; }
  const arrow = CALL.trend > 0 ? "▲" : CALL.trend < 0 ? "▼" : "▶";
  const color = CALL.trend > 0 ? "var(--green-t)" : CALL.trend < 0 ? "var(--amber-t)" : "var(--muted)";
  const pos = Math.max(2, Math.min(98, CALL.temp / 7 * 100));
  const who = CALL.phase === "gk" ? "Front desk" : "Prospect";
  const html = `<div class="read"><span style="color:${color}" aria-hidden="true">${arrow}</span><span>${who}: ${esc(read.toLowerCase())}</span></div>
    <div class="meter" role="meter" aria-label="How the call is going" aria-valuemin="0" aria-valuemax="7" aria-valuenow="${CALL.temp.toFixed(1)}"><i style="left:${pos}%"></i></div>
    <div class="ends"><span>Cooling</span><span>Warming</span></div>
    <div class="tip ${cls}">${esc(tipText)}</div>`;
  if (g.dataset.html !== html){ g.dataset.html = html; g.innerHTML = html; }
}

function setMood(m){
  const sc = (MOOD_GUIDE[m] || MOOD_GUIDE.neutral)[0];
  CALL.trend = sc > CALL.lastScore ? 1 : sc < CALL.lastScore ? -1 : 0;
  CALL.lastScore = sc;
  CALL.temp = m === "annoyed" ? sc : CALL.temp * 0.4 + sc * 0.6;   // a nerve hit shows at once
  CALL.mood = m;
  updateGuide();
}
function updateGuide(){
  const g = document.getElementById("guide"); if (!g) return;
  if (!CALL.net) return updateCallGuide(g);
  const [, read, tip] = MOOD_GUIDE[CALL.mood] || MOOD_GUIDE.neutral;
  const held = CALL.repSince ? (Date.now() - CALL.repSince) / 1000 : 0;
  let tipText = tip, cls = CALL.mood === "annoyed" ? "hot" : (CALL.mood === "distracted" || CALL.mood === "closed") ? "warn" : "";
  const cue = camCue();
  const mins = CALL.t0 ? (Date.now() - CALL.t0) / 60000 : 0;
  if (held >= 20){ tipText = `You've had the floor ${Math.floor(held)} seconds. Finish the thought and ask them something.`; cls = "warn"; }
  else if (cue){ tipText = cue; cls = "warn"; }
  else if (mins >= 9.5){ tipText = "Last chance: name the next step now, or thank them and let them go."; cls = "hot"; }
  else if (mins >= 8){ tipText = "You're at 8 minutes. Name the reason to follow up and wrap it."; cls = "warn"; }
  else if (mins >= 6 && ["neutral","warm","interested","amused","thinking"].includes(CALL.mood)){ tipText = "Six minutes in. Start looking for the reason to follow up."; }
  const arrow = CALL.trend > 0 ? "▲" : CALL.trend < 0 ? "▼" : "▶";
  const color = CALL.trend > 0 ? "var(--green-t)" : CALL.trend < 0 ? "var(--amber-t)" : "var(--muted)";
  const pos = Math.max(2, Math.min(98, CALL.temp / 7 * 100));
  const html = `<div class="read"><span style="color:${color}" aria-hidden="true">${arrow}</span><span>${esc(read)}</span></div>
    <div class="meter" role="meter" aria-label="How the conversation is going" aria-valuemin="0" aria-valuemax="7" aria-valuenow="${CALL.temp.toFixed(1)}"><i style="left:${pos}%"></i></div>
    <div class="ends"><span>Cooling</span><span>Warming</span></div>
    <div class="tip ${cls}">${esc(tipText)}</div>${CALL.camNote ? `<div class="faint" style="font-size:12px">${esc(CALL.camNote)}</div>` : ""}`;
  if (g.dataset.html !== html){ g.dataset.html = html; g.innerHTML = html; }
}

// ---- waiting line: coaching cards (only while waiting for a slot)
function prepDeck(){
  const p = CALL.prep; if (!p || !p.cards || !p.cards.length) return "";
  const noun = CALL.net ? "conversation" : "call";
  const sub = p.personal ? `Based on your last ${p.based_on} ${noun}${p.based_on === 1 ? "" : "s"}` : `Tips to start with`;
  const card = c => {
    const vals = c.values || [], mx = Math.max(...vals, 1);
    const spark = vals.length ? `<div class="pspark" aria-hidden="true">${vals.map((v, i) => `<i class="${i === vals.length - 1 && c.good ? "t" : ""}" style="height:${Math.max(12, Math.round(v / mx * 100))}%"></i>`).join("")}</div>` : "";
    return `<div class="pcard k-${esc(c.kind)}" aria-hidden="true"><div class="ptag">${esc(c.tag)}</div><div class="ptitle">${esc(c.title)}</div>${spark}
      ${c.body ? `<div class="pbody">${esc(c.body)}</div>` : ""}${c.say ? `<div class="psay">${esc(/^["“]/.test(c.say) || c.kind !== "keep" && c.kind !== "line" && c.kind !== "tip" ? c.say : "“" + c.say + "”")}</div>` : ""}</div>`;
  };
  return `<div class="prep"><div class="prep-h"><b>${CALL.net ? "Before you walk up" : "While you wait"}</b><span>${esc(sub)}</span></div>
    <div class="prep-deck" id="prepdeck">${p.cards.map(card).join("")}</div>
    ${p.cards.length > 1 ? `<div class="pdots" id="prepdots">${p.cards.map((_, i) => `<button type="button" aria-label="Card ${i + 1} of ${p.cards.length}"></button>`).join("")}</div>` : ""}</div>`;
}
// One card at a time. Each stays up 15 to 30 seconds depending on how much there is to read, then the next fades in.
// The position survives the screen redrawing while the rep waits.
function prepDwell(i){
  const c = (CALL.prep && CALL.prep.cards[i]) || {};
  const words = [c.title, c.body, c.say].join(" ").split(/\s+/).length;
  return Math.min(30000, Math.max(15000, words * 450));
}
function showPrep(i, restart){
  const d = document.getElementById("prepdeck"); if (!d || !CALL.prep) return;
  const n = CALL.prep.cards.length; i = ((i % n) + n) % n; CALL.prepIdx = i;
  [...d.children].forEach((c, k) => { c.classList.toggle("on", k === i); c.setAttribute("aria-hidden", k === i ? "false" : "true"); });
  const dots = document.getElementById("prepdots");
  if (dots) [...dots.children].forEach((x, k) => x.classList.toggle("on", k === i));
  if (restart || !CALL.prepNext) CALL.prepNext = Date.now() + prepDwell(i);
  clearTimeout(CALL.prepTimer);
  if (n > 1) CALL.prepTimer = setTimeout(() => { CALL.prepNext = null; showPrep(CALL.prepIdx + 1, true); }, Math.max(500, CALL.prepNext - Date.now()));
}
function wirePrepDeck(){
  const d = document.getElementById("prepdeck"); if (!d){ clearTimeout(CALL.prepTimer); return; }
  // the deck is as tall as its tallest card, so nothing below it jumps when cards change
  d.style.height = Math.max(...[...d.children].map(c => c.offsetHeight)) + "px";
  const dots = document.getElementById("prepdots");
  if (dots) [...dots.children].forEach((b, k) => b.onclick = () => showPrep(k, true));
  let x0 = null;
  d.ontouchstart = e => { x0 = e.touches[0].clientX; };
  d.ontouchend = e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) showPrep(CALL.prepIdx + (dx < 0 ? 1 : -1), true); };
  // the screen redraws every few seconds while waiting: put the current card straight back, no fade
  d.classList.add("instant"); if (dots) dots.classList.add("instant");
  showPrep(CALL.prepIdx || 0, false);
  requestAnimationFrame(() => requestAnimationFrame(() => { d.classList.remove("instant"); if (dots) dots.classList.remove("instant"); }));
}

function renderLive(state, position){
  CALL.state = state;
  if (state === "queued") CALL.queuePos = position;
  if (CALL.net) return renderFaceToFace(state, position);
  const name = CALL.caller.name, sub = CALL.caller.sub;
  const status = state === "queued" ? `All lines busy. You're #${position} in line.` :
                 state === "dialing" ? "Dialing…" : state === "ringing" ? "Ringing…" :
                 state === "transfer" ? "On hold, transferring…" : state === "voicemail" ? "Voicemail. Leave your message at the beep, then hang up." : "";
  const live = state === "connected" || state === "transfer" || state === "voicemail";
  callFrame(`
    <div class="avatar">${state==="ringing"||state==="dialing" ? '<div class="ring"></div>' : ""}<div class="face">${esc(initials(name))}</div></div>
    <div style="font-size:24px;font-weight:700;text-align:center;margin-top:8px">${esc(name)}</div>
    <div class="muted" style="font-size:15px;text-align:center">${esc(sub)}</div>
    <div id="clock" class="mono" style="font-size:20px;min-height:28px">${CALL.t0 ? fmtTime((Date.now()-CALL.t0)/1000) : ""}</div>
    ${status ? `<div class="pill" style="font-size:13px" role="status">${esc(status)}</div>` : ""}
    ${state === "queued" ? prepDeck() : `<div id="wave" class="wave" aria-hidden="true">${"<i></i>".repeat(14)}</div>`}
    ${live && state !== "transfer" ? `<div id="guide" class="guide" aria-live="polite"></div>` : ""}
    <div id="caps" class="captions ${CALL.captions ? "" : "hidden"}" aria-live="polite"></div>
    ${!CALL.captions ? '<div style="flex:1"></div>' : ""}
    <div class="row" style="gap:20px;margin-top:8px">
      ${live ? `<button id="mute" class="round" type="button" aria-label="Mute" aria-pressed="${CALL.muted}">${ICON.mic}</button>` : ""}
      <button id="hang" class="hang" type="button" aria-label="End call"><span style="transform:rotate(135deg);display:flex">${ICON.phone}</span></button>
      ${live ? `<button id="ccb" class="round" type="button" aria-label="Show words" aria-pressed="${CALL.captions}">${ICON.cc}</button>` : ""}
    </div>`);
  const caps = document.getElementById("caps");
  CALL.lines.forEach(l => caps.appendChild(bubble(l)));
  caps.scrollTop = caps.scrollHeight;
  updateGuide();
  wirePrepDeck();
  document.getElementById("hang").onclick = () => endCall(true);
  const mute = document.getElementById("mute");
  if (mute) mute.onclick = () => { CALL.muted = !CALL.muted; mute.setAttribute("aria-pressed", CALL.muted); try { CALL.mic.getAudioTracks().forEach(t => t.enabled = !CALL.muted); } catch(e){} };
  const ccb = document.getElementById("ccb");
  if (ccb) ccb.onclick = () => { CALL.captions = !CALL.captions; renderLive(CALL.state); };
}

function renderFaceToFace(state, position){
  const status = state === "queued" ? `All practice slots are busy. You're #${position} in line.` :
                 state === "dialing" || state === "ringing" ? (CALL.card.rep_card.approach === "them" ? "They're walking up…" : "Walking over…") : "";
  const live = state === "connected";
  callFrame(`
    <div id="face" class="face-wrap${state === "queued" ? " q" : ""}" aria-hidden="true"></div>
    <div class="row" style="gap:12px;align-items:center"><div class="badge" style="min-width:0"><b>${esc(CALL.caller.name)}</b><span>${esc(CALL.caller.sub)}</span></div>
      <div id="clock" class="mono" style="font-size:16px;min-width:48px">${CALL.t0 ? fmtTime((Date.now()-CALL.t0)/1000) : ""}</div></div>
    ${live ? `<div id="guide" class="guide" aria-live="polite"></div>` : ""}
    ${status ? `<div class="pill" style="font-size:13px" role="status">${esc(status)}</div>` : ""}
    ${state === "queued" ? prepDeck() : ""}
    <div id="caps" class="captions ${CALL.captions ? "" : "hidden"}" aria-live="polite" style="max-height:22vh"></div>
    ${!CALL.captions ? '<div style="flex:1"></div>' : ""}
    <div class="row" style="gap:20px;margin-top:4px">
      ${live ? `<button id="mute" class="round" type="button" aria-label="Mute" aria-pressed="${CALL.muted}">${ICON.mic}</button>` : ""}
      <button id="hang" class="hang" type="button" aria-label="${state === "queued" ? "Leave the line" : "Walk away"}" style="width:auto;padding:0 22px;border-radius:38px;font-weight:700;font-size:15px">${state === "queued" ? "Leave the line" : "Walk away"}</button>
      ${live ? `<button id="ccb" class="round" type="button" aria-label="Show words" aria-pressed="${CALL.captions}">${ICON.cc}</button>` : ""}
    </div>`);
  drawFace();
  attachSelfView();
  updateGuide();
  wirePrepDeck();
  const caps = document.getElementById("caps");
  CALL.lines.forEach(l => caps.appendChild(bubble(l)));
  caps.scrollTop = caps.scrollHeight;
  document.getElementById("hang").onclick = () => endCall(true);
  const mute = document.getElementById("mute");
  if (mute) mute.onclick = () => { CALL.muted = !CALL.muted; mute.setAttribute("aria-pressed", CALL.muted); try { CALL.mic.getAudioTracks().forEach(t => t.enabled = !CALL.muted); } catch(e){} };
  const ccb = document.getElementById("ccb");
  if (ccb) ccb.onclick = () => { CALL.captions = !CALL.captions; renderLive(CALL.state); };
}

function bubble(l){
  const d = document.createElement("div");
  d.className = "bubble " + (l.speaker === "rep" ? "me" : l.speaker === "system" ? "sys" : "them");
  d.textContent = l.text;
  return d;
}
function addLine(l){ CALL.lines.push(l); const caps = document.getElementById("caps"); if (caps){ caps.appendChild(bubble(l)); caps.scrollTop = caps.scrollHeight; } }
function wave(kind){ const w = document.getElementById("wave"); if (w) w.className = "wave" + (kind ? " " + kind : ""); if (CALL.net && kind !== "on" && CALL.talking){ CALL.talking = false; drawFace(); } }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function prospectHungUp(){
  if (CALL.ended || CALL.hungUp) return;
  CALL.hungUp = true;
  if (!CALL.net) try { tones().hangup(); } catch(e){}
  wave("");
  const ended = CALL.net ? "Conversation over" : "Call ended";
  const st = document.querySelector("#call [role=status]");
  if (st) st.textContent = ended;
  else { const c = document.getElementById("clock"); if (c) c.insertAdjacentHTML("afterend", `<div class="pill" style="font-size:13px" role="status">${ended}</div>`); }
  setTimeout(() => endCall(false), 1400);
}

async function endCall(byRep){
  if (CALL.ended) return;
  CALL.ended = true;
  clearInterval(CALL.pingTimer); clearInterval(CALL.clockTimer); clearTimeout(CALL.prepTimer);
  if (CAM.on){ const p = camPost(true); camStop(); await p; }
  try { tones().stopRing(); if (byRep && !CALL.net) tones().hangup(); } catch(e){}
  hangUpMedia();
  let r = null;
  try { r = await api(`/api/calls/${CALL.id}/hangup`, {method:"POST"}); } catch(e){}
  const secs = CALL.t0 ? (Date.now() - CALL.t0)/1000 : 0;
  closeCall();
  if (!r || r.status === "abandoned") return renderHome();
  renderScoring(CALL.id, secs, CALL.net);
}

function failCall(msg){
  try { tones().stopRing(); } catch(e){}
  if (CAM.on) camStop();
  CALL.ended = true; clearInterval(CALL.pingTimer); clearInterval(CALL.clockTimer); clearTimeout(CALL.prepTimer);
  hangUpMedia();
  if (CALL.id) api(`/api/calls/${CALL.id}/hangup`, {method:"POST"}).catch(() => {});
  callFrame(`<div style="flex:1"></div><div class="err" style="max-width:420px">${esc(msg)}</div><button class="btn ghost" style="max-width:420px" type="button" id="back">Back</button><div style="flex:1"></div>`);
  document.getElementById("back").onclick = () => { closeCall(); renderHome(); };
}

// ======================================================================= debrief
function renderScoring(id, secs, net){
  $app.className = "wrap";
  $app.replaceChildren(h(`<div class="stack" style="align-items:center;margin-top:20vh;text-align:center"><div class="spin"></div>
    <div style="font-size:20px;font-weight:700">Scoring your ${net ? "conversation" : "call"}</div><div class="muted" id="scoremsg">${net ? "Conversation" : "Call"} time ${fmtTime(secs)}. This takes about a minute.</div></div>`));
  let tries = 0;
  const poll = async () => {
    tries++;
    try { const a = await api(`/api/attempts/${id}`); if (a.status === "graded" || a.status === "failed") return renderDebrief(id, a); } catch(e){ if (e.message === "signed out") return; }
    if (tries === 40){  // about two minutes
      const m = document.getElementById("scoremsg");
      if (m) m.innerHTML = "Taking longer than usual. It will finish on its own and appear in your History, so you can start your next call. <button class='btn ghost small' type='button' id='leave'>Back to practice</button>";
      const b = document.getElementById("leave"); if (b) b.onclick = renderHome;
    }
    setTimeout(poll, tries < 20 ? 3000 : 8000);
  };
  setTimeout(poll, 2500);
}

function md(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
  const out = []; let list = false;
  for (const raw of String(src || "").split("\n")){
    const line = raw.trimEnd();
    if (/^#{1,4}\s/.test(line)){ if (list){ out.push("</ul>"); list = false; } out.push(`<h3>${inline(line.replace(/^#+\s*/,""))}</h3>`); }
    else if (/^\s*[-*]\s+/.test(line)){ if (!list){ out.push("<ul>"); list = true; } out.push(`<li>${inline(line.replace(/^\s*[-*]\s+/,""))}</li>`); }
    else if (!line.trim()){ if (list){ out.push("</ul>"); list = false; } }
    else { if (list){ out.push("</ul>"); list = false; } out.push(`<p>${inline(line)}</p>`); }
  }
  if (list) out.push("</ul>");
  return out.join("");
}

function callBlock(cb, net){
  if (!cb || !cb.focus || !cb.focus.what) return "";
  const f = cb.focus, k = cb.keep || {};
  return `<div class="card stack" style="gap:14px;border:1px solid #2E5E45">
    <div class="eyebrow" style="color:#5BD08A">${net ? "Take this to your next event" : "Your next call block"}</div>
    <div class="stack" style="gap:4px"><div style="font-weight:800">1 · Focus on: ${esc(f.what)}</div>
      ${f.say ? `<div style="font-size:15px;line-height:1.5;padding:8px 12px;border-left:3px solid #F2A65A;background:rgba(242,166,90,.08)">Say: “${esc(f.say)}”</div>` : ""}
      ${f.target ? `<div style="font-size:14px;color:var(--text2)">Target: ${esc(f.target)}</div>` : ""}</div>
    ${k.what ? `<div class="stack" style="gap:4px"><div style="font-weight:800">2 · Keep doing: ${esc(k.what)}</div>
      ${k.quote ? `<div style="font-size:14px;color:var(--text2)">${k.t ? esc(k.t) + " · " : ""}“${esc(k.quote)}”</div>` : ""}</div>` : ""}
    ${cb.push ? `<div style="font-weight:700;line-height:1.5">3 · ${esc(cb.push)}</div>` : ""}
  </div>`;
}

async function renderDebrief(id, a){
  a = a || await api(`/api/attempts/${id}`);
  $app.className = "wrap";
  const net = isNet(a);
  if (a.status === "grading") return renderScoring(id, a.transcript && a.transcript.length ? a.transcript[a.transcript.length-1].end : 0, net);
  if (a.status !== "graded"){
    $app.replaceChildren(h(`<div class="stack"><button class="btn ghost small" type="button" id="back" style="align-self:flex-start">Back</button>
      <div class="err">This ${net ? "conversation" : "call"} couldn't be scored${a.error ? ": " + esc(a.error) : ""}. Your manager can retry it.</div></div>`));
    document.getElementById("back").onclick = renderHome; return;
  }
  const r = a.result;
  const dur = a.transcript && a.transcript.length ? a.transcript[a.transcript.length-1].end : 0;
  $app.replaceChildren(h(`<div class="stack" style="gap:22px">
    <div class="between"><button class="btn ghost small" type="button" id="back">Back</button><div class="mono muted" style="font-size:14px">${esc(fmtDate(a.date))} · ${fmtTime(dur)}</div></div>
    <div class="row" style="gap:16px">
      <div style="width:84px;height:84px;border-radius:50%;border:6px solid ${scoreColor(r.overall)};display:flex;align-items:center;justify-content:center;flex-shrink:0" class="mono"><span style="font-size:22px">${r.overall == null ? "–" : r.overall.toFixed(2)}</span></div>
      <div class="stack" style="gap:4px"><div style="font-size:20px;font-weight:800">${esc(r.band || "")}</div>
        <div style="font-size:14px;color:var(--text2)">${net ? esc(a.rep_card.target) + " · " : ""}${esc(a.rep_card.company)} · ${esc(OUTCOMES[r.outcome] || r.outcome || "")}</div>
        <div style="font-size:14px;color:var(--text2)">Best possible outcome reached: ${esc(r.reached_best || "–")}</div></div>
    </div>
    ${r.gap || r.strength ? `<div class="card stack" style="gap:12px">
      ${r.gap ? `<div class="stack" style="gap:3px"><div class="eyebrow" style="color:#F2A65A">Biggest gap · ${esc(r.gap.phase)}</div><div style="font-size:16px;line-height:1.45">${esc(r.gap.text || "")}</div></div>` : ""}
      ${r.strength ? `<div class="stack" style="gap:3px"><div class="eyebrow" style="color:#5BD08A">Strongest · ${esc(r.strength.phase)}</div><div style="font-size:16px;line-height:1.45">${esc(r.strength.text || "")}</div></div>` : ""}
    </div>` : ""}
    ${callBlock(r.call_block, net)}
    ${(r.integrity_flags || []).length ? `<div class="row" style="align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;background:#3A2A12;border:1px solid #6B4A17">${ICON.warn}
      <div style="font-size:14px;line-height:1.45;color:#F5E3BC"><strong>Integrity flag.</strong> ${esc((r.integrity_flags||[]).map(f => (f.t ? f.t + " " : "") + (f.quote || f.id || "")).join(" · "))}. Your score is capped at 2.5.</div></div>` : ""}
    <div class="card stack" style="gap:11px"><div class="eyebrow">Scores by phase</div>${phaseBars(r.phase_scores)}</div>
    ${net && r.metrics && r.metrics.eye_contact_pct != null ? `<div class="card stack" style="gap:12px">
      <div class="eyebrow">On camera</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
        <div><div class="muted" style="font-size:13px">Eye contact</div><div class="mono" style="font-size:20px">${r.metrics.eye_contact_pct}%</div>
          ${r.metrics.eye_contact_while_they_talk_pct != null ? `<div class="faint" style="font-size:12px">${r.metrics.eye_contact_while_they_talk_pct}% while they talked</div>` : ""}</div>
        <div><div class="muted" style="font-size:13px">Smiled at the start</div><div style="font-size:18px;font-weight:700">${r.metrics.smiled_in_first_15s ? "Yes" : "No"}</div></div>
        <div><div class="muted" style="font-size:13px">Nods while they talked</div><div class="mono" style="font-size:20px">${r.metrics.nods_while_they_talk ?? "–"}</div></div>
        <div><div class="muted" style="font-size:13px">Steady</div><div class="mono" style="font-size:20px">${r.metrics.steady_pct ?? "–"}%</div></div>
      </div>
      <div class="faint" style="font-size:12px">Measured in your browser. Nothing was recorded. Not counted in your score yet.</div></div>` : ""}
    <div class="md">${md(r.debrief)}</div>
    <details class="card"><summary style="cursor:pointer;font-weight:700">Transcript</summary>
      <div class="stack" style="gap:8px;margin-top:12px">${(a.transcript||[]).map(t => `<div style="font-size:14px;line-height:1.45"><span class="mono faint">${fmtTime(t.start)}</span> <strong>${esc(t.speaker === "rep" ? "You" : t.speaker === "dm" ? (net ? (a.rep_card.target || "Them").split(" ")[0] : "Prospect") : t.speaker === "gatekeeper" ? "Front desk" : "Voicemail")}${t.interrupted ? " (you cut in)" : t.cut_in ? " (cut you off)" : ""}:</strong> ${esc(t.text)}</div>`).join("")}</div></details>
    ${a.mine !== false && parseRoute().page !== "admin" ? `<button class="btn" type="button" id="next">${net ? "Next conversation" : "Next dial"}</button>` : ""}
  </div>`));
  document.getElementById("back").onclick = renderHome;
  const next = document.getElementById("next");
  if (next) next.onclick = () => go(`#/p/${a.practice || "cold_call"}/practice`);
  window.scrollTo(0,0);
}

// ======================================================================= boot
(async function boot(){
  const inv = (location.hash.match(/invite=([^&]+)/) || [])[1];
  if (inv) return renderInvite(decodeURIComponent(inv));
  if (!TOKEN) return renderLogin();
  try { ME = await api("/api/me"); renderHome(); }
  catch(e){ if (e.message !== "signed out") renderLogin(e.message); }
})();
</script>
